<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f1ea" />
  <title>Bloom · At-home beauty, thoughtfully delivered</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">b</span><span>Bloom</span></div>
      <div class="workspace-label">Workspace</div>
      <button class="role-switcher" id="roleSwitcher" type="button" aria-label="Change workspace role"></button>
      <nav id="nav" class="nav-list"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-card">
        <span class="eyebrow">Bloom care</span>
        <strong>Every visit, a little more well.</strong>
        <button class="text-button" data-action="support">Contact support <span>↗</span></button>
      </div>
      <button class="profile-mini" data-action="profile"><span class="avatar">RS</span><span><b>Riya Sharma</b><small>Personal account</small></span><span>•••</span></button>
    </aside>

    <main class="main-content">
      <header class="topbar"><div class="mobile-brand"><span class="brand-mark">b</span> Bloom</div><div class="breadcrumb" id="breadcrumb"></div><div class="top-actions"><button class="icon-button" data-action="notifications" aria-label="Notifications">♧<i></i></button><button class="avatar avatar-button" data-action="profile">RS</button></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
